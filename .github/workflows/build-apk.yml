name: Build HandARBrowser Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin the runner so the build does not change underneath us during
    # the ubuntu-latest migration scheduled for October 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Check Java and Gradle versions
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version

      - name: Download MediaPipe hand model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-all-errors \
            -o app/src/main/assets/hand_landmarker.task \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
          test -s app/src/main/assets/hand_landmarker.task
          ls -lh app/src/main/assets/hand_landmarker.task

      - name: Preflight source checks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'import androidx.activity.ComponentActivity;' app/src/main/java/com/handar/browser/MainActivity.java
          grep -Fq 'public class MainActivity extends ComponentActivity implements SensorEventListener {' app/src/main/java/com/handar/browser/MainActivity.java
          ! grep -Fq 'input.width()' app/src/main/java/com/handar/browser/MainActivity.java
          ! grep -Fq 'input.height()' app/src/main/java/com/handar/browser/MainActivity.java
          grep -Fq 'androidx.activity:activity:1.13.0' app/build.gradle.kts
          grep -Fq 'android-actions/setup-android@v4' .github/workflows/build-apk.yml
          grep -Fq 'getInsetsController();' app/src/main/java/com/handar/browser/MainActivity.java
          grep -Fq 'if (controller != null)' app/src/main/java/com/handar/browser/MainActivity.java
          grep -Fq 'root.post(() -> {' app/src/main/java/com/handar/browser/MainActivity.java
          echo 'Preflight checks: OK'

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Verify and normalize APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -t APKS < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo 'ERROR: Gradle finished successfully but no APK was produced.' >&2
            find app/build/outputs -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

          APK="${APKS[0]}"
          echo "Found APK: $APK"
          test -s "$APK"
          cp "$APK" dist/HandARBrowser.apk
          test -s dist/HandARBrowser.apk
          unzip -t "$APK" >/dev/null
          echo "APK archive integrity: OK"
          echo "Normalized APK: dist/HandARBrowser.apk"
          ls -lh "$APK" dist/HandARBrowser.apk

          if command -v apkanalyzer >/dev/null 2>&1; then
            echo "Application ID:"
            apkanalyzer manifest application-id "$APK" || true
          fi

          if command -v apksigner >/dev/null 2>&1; then
            echo "APK signature:"
            apksigner verify --verbose "$APK" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HandARBrowser-APK
          path: dist/HandARBrowser.apk
          if-no-files-found: error
          retention-days: 14
